name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Base desechable del servicio mariadb de cada job: los nombres terminan en _test (las suites se niegan a correr si no).
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USER: root
  DB_PASS: ci-root-pass

jobs:
  frontend:
    name: Frontend (lint · unitarias · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: frontend-coverage, path: coverage/, retention-days: 14 }

  backend:
    name: Backend (ruff · mypy · pytest · contrato PHP/Python · reglas de BD)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4
        env: { MARIADB_ROOT_PASSWORD: ci-root-pass }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-pass" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.2", extensions: pdo_mysql, mbstring, openssl }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.txt pytest-cov pip-audit
      - name: Análisis estático
        working-directory: backend
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/mypy app
      - name: Reglas de integridad de la base (PHP)
        env: { DB_NAME: optimus_test }
        run: |
          mysql -h127.0.0.1 -uroot -pci-root-pass -e "CREATE DATABASE optimus_test CHARACTER SET utf8mb4"
          php database/migrate.php up
          php database/tests/db_rules_test.php
      - name: pytest con cobertura
        env: { DB_NAME: optimus_test_py }
        run: |
          mysql -h127.0.0.1 -uroot -pci-root-pass -e "CREATE DATABASE optimus_test_py CHARACTER SET utf8mb4"
          DB_NAME=optimus_test_py php database/migrate.php up
          cd backend && .venv/bin/python -m pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Contrato de 111 casos contra PHP y contra Python
        run: |
          for impl in php python; do
            mysql -h127.0.0.1 -uroot -pci-root-pass -e "DROP DATABASE IF EXISTS optimus_contract_test; CREATE DATABASE optimus_contract_test CHARACTER SET utf8mb4"
            DB_NAME=optimus_contract_test php database/migrate.php up
            if [ "$impl" = python ]; then export API_IMPL=python; else unset API_IMPL; fi
            DB_NAME=optimus_contract_test php api/v1/tests/api_test.php
          done
      - name: Comparación diferencial PHP ↔ Python
        env: { DB_NAME: optimus_compare_test }
        run: |
          mysql -h127.0.0.1 -uroot -pci-root-pass -e "CREATE DATABASE optimus_compare_test CHARACTER SET utf8mb4"
          php database/migrate.php up
          backend/.venv/bin/python backend/tests/compare_backends.py | tee compare.txt
          grep -q "con diferencias: 3" compare.txt   # las 3 conocidas (JSON_ARRAYAGG en MariaDB < 10.5); cualquier otra rompe el build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-coverage, path: backend/coverage.xml, retention-days: 14 }

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4
        env: { MARIADB_ROOT_PASSWORD: ci-root-pass }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-pass" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      E2E_BROWSER_CHANNEL: chromium
      E2E_DB_PORT: 3306
      E2E_DB_PASS: ci-root-pass
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.2", extensions: pdo_mysql }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: "playwright-report/\ntest-results/", retention-days: 14 }

  security:
    name: Seguridad (dependencias y secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm audit --audit-level=moderate
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: Búsqueda de secretos en el árbol de trabajo
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.[a-z]+)?$' | grep -v '\.example$'; then echo "Archivo .env versionado"; exit 1; fi
          if git grep -nIE 'BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{20,}' -- . ':!docs' ':!e2e' ':!tests'; then exit 1; fi

  gate:
    name: Resultado global
    if: always()
    needs: [frontend, backend, e2e, security]
    runs-on: ubuntu-latest
    steps:
      - name: Todas las comprobaciones deben haber pasado (ninguna omitida)
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.frontend.result }}" = success && test "${{ needs.backend.result }}" = success \
            && test "${{ needs.e2e.result }}" = success && test "${{ needs.security.result }}" = success
